      const reverseTranslations = Object.fromEntries(
        Object.entries(translations).map(([english, vietnamese]) => [
          vietnamese,
          english,
        ]),
      );
      const textTranslations = new WeakMap();
      const attributeTranslations = new WeakMap();

      function createTranslationRecord(value) {
        const trimmed = value.trim();
        const source = Object.prototype.hasOwnProperty.call(
          translations,
          trimmed,
        )
          ? trimmed
          : reverseTranslations[trimmed] || trimmed;
        return {
          source,
          leading: value.match(/^\s*/)?.[0] || "",
          trailing: value.match(/\s*$/)?.[0] || "",
          output: value,
        };
      }

      function translatePublicSite(language) {
        const walker = document.createTreeWalker(
          document.body,
          NodeFilter.SHOW_TEXT,
        );
        let node;
        while ((node = walker.nextNode())) {
          if (
            node.parentElement?.closest(
              "script,style,noscript,.site-language-switcher",
            )
          )
            continue;
          const value = node.nodeValue || "";
          if (!value.trim()) continue;
          let record = textTranslations.get(node);
          if (!record || record.output !== value) {
            record = createTranslationRecord(value);
          }
          const translated =
            language === "vi"
              ? translations[record.source] || record.source
              : record.source;
          record.output = `${record.leading}${translated}${record.trailing}`;
          textTranslations.set(node, record);
          node.nodeValue = record.output;
        }

        document
          .querySelectorAll("[aria-label],[title],[placeholder],[alt]")
          .forEach((element) => {
            if (element.closest(".site-language-switcher")) return;
            let records = attributeTranslations.get(element);
            if (!records) {
              records = new Map();
              attributeTranslations.set(element, records);
            }
            ["aria-label", "title", "placeholder", "alt"].forEach(
              (attribute) => {
                const value = element.getAttribute(attribute);
                if (!value) return;
                let record = records.get(attribute);
                if (!record || record.output !== value) {
                  record = createTranslationRecord(value);
                }
                const translated =
                  language === "vi"
                    ? translations[record.source] || record.source
                    : record.source;
                record.output = `${record.leading}${translated}${record.trailing}`;
                records.set(attribute, record);
                element.setAttribute(
                  attribute,
                  record.output,
                );
              },
            );
          });
      }

      function ParticleCanvas() {
        const canvasRef = useRef(null);
        useEffect(() => {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext("2d");
          let width = 0,
            height = 0,
            frame = 0,
            points = [],
            raf;
          const resize = () => {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = rect.width;
            height = rect.height;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const count = Math.min(85, Math.floor(width / 15));
            points = Array.from({ length: count }, () => ({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.28,
              vy: (Math.random() - 0.5) * 0.28,
              r: Math.random() * 1.8 + 0.6,
            }));
          };
          const draw = () => {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < points.length; i++) {
              const p = points[i];
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < 0 || p.x > width) p.vx *= -1;
              if (p.y < 0 || p.y > height) p.vy *= -1;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(240,205,153,.72)";
              ctx.fill();
              for (let j = i + 1; j < points.length; j++) {
                const q = points[j],
                  dx = p.x - q.x,
                  dy = p.y - q.y,
                  dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 125) {
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(q.x, q.y);
                  ctx.strokeStyle = `rgba(240,205,153,${(1 - dist / 125) * 0.16})`;
                  ctx.lineWidth = 1;
                  ctx.stroke();
                }
              }
            }
            frame++;
            raf = requestAnimationFrame(draw);
          };
          resize();
          draw();
          window.addEventListener("resize", resize);
          return () => {
            cancelAnimationFrame(raf);
            window.removeEventListener("resize", resize);
          };
        }, []);
        return (
          <canvas id="particle-canvas" ref={canvasRef} aria-hidden="true" />
        );
      }

      function App() {
        const [page, setPage] = useState("home");
        const [theme, setTheme] = useState(
          () => localStorage.getItem("drikapex-theme") || "light",
        );
        const [language, setLanguage] = useState(() =>
          localStorage.getItem("drikapex-language") === "en" ? "en" : "vi",
        );
        const [showTop, setShowTop] = useState(false);

        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          localStorage.setItem("drikapex-theme", theme);
        }, [theme]);

        useEffect(() => {
          document.documentElement.lang = language;
          localStorage.setItem("drikapex-language", language);
          document.title =
            language === "vi"
              ? "Drikapex Group — Cộng đồng Minecraft & Arena War"
              : "Drikapex Group — Minecraft Community & Arena War";
          const description = document.querySelector(
            'meta[name="description"]',
          );
          if (description) {
            description.content =
              language === "vi"
                ? "Drikapex là cộng đồng Minecraft với các chế độ chơi đặc biệt, hoạt động cộng đồng và cơ hội đóng góp."
                : "Drikapex is a Minecraft community with special game modes, community events and opportunities to contribute.";
          }
        }, [language, page]);

        useLayoutEffect(() => {
          translatePublicSite(language);
        });

        useEffect(() => {
          const syncLanguage = (event) => {
            if (
              event.key === "drikapex-language" &&
              (event.newValue === "vi" || event.newValue === "en")
            ) {
              setLanguage(event.newValue);
            }
          };
          window.addEventListener("storage", syncLanguage);
          return () => window.removeEventListener("storage", syncLanguage);
        }, []);

        useEffect(() => {
          const onHash = () => {
            const requested = window.location.hash.replace("#", "") || "home";
            setPage(
              navItems.some((n) => n.id === requested) ? requested : "home",
            );
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          window.addEventListener("hashchange", onHash);
          if (window.location.hash) onHash();
          return () => window.removeEventListener("hashchange", onHash);
        }, []);

        useEffect(() => {
          const onScroll = () => setShowTop(window.scrollY > 450);
          window.addEventListener("scroll", onScroll, { passive: true });
          onScroll();
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.12 },

              el.style.transform = `translate3d(0, ${y * speed * -1}px, 0)`;
